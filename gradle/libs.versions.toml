[versions]
agp = "9.0.0"
kotlin = "2.1.21"

[libraries]
libxposedApi = { group = "io.github.libxposed", name = "api", version = "101.0.1" }
libxposedService = { group = "io.github.libxposed", name = "service", version = "101.0.0" }
coreKtx = { group = "androidx.core", name = "core-ktx", version = "1.15.0" }
kotlinxSerializationJson = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.7.3" }
composeBom = { group = "androidx.compose", name = "compose-bom", version = "2025.01.01" }
composeUi = { group = "androidx.compose.ui", name = "ui" }
composeFoundation = { group = "androidx.compose.foundation", name = "foundation" }
activityCompose = { group = "androidx.activity", name = "activity-compose", version = "1.9.3" }
material3 = { group = "androidx.compose.material3", name = "material3", version = "1.3.1" }

[plugins]
agp = { id = "com.android.application", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
